# .github/workflows/deploy-release.yml

name: Docker Release

# =========================================================
# 🚀 Production Docker Release
# ---------------------------------------------------------
# Trigger:
# - Runs when a version tag is pushed
#   Example:
#     git push origin v1.2.3
#
# Purpose:
# - Build and publish production-ready Docker images
# - Supports multi-architecture:
#     - linux/amd64
#     - linux/arm64
#
# Tag Strategy:
# - v1.2.3 → exact version
# - v1.2   → minor tracking
# - v1     → major tracking
# - latest → only for default branch
# =========================================================

on:
  push:
    tags:
      - "v*.*.*" # Matches v1.2.3, v1.2.3-alpha.1, etc.

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: 🚀 Build & Push Release Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write  # Add this for enhanced security

    steps:
      # 📥 Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 🛑 Validate tag format
      - name: 🛑 Validate version tag
        id: validate
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}

          echo "🔍 Validating tag: $RAW_TAG"

          # Strict SemVer with pre-release support
          # REGEX="^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$"
          REGEX='^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$'

          if [[ ! "$RAW_TAG" =~ $REGEX ]]; then
            echo "❌ Invalid tag format: $RAW_TAG"
            echo "✅ Expected formats:"
            echo "   v1.2.3"
            echo "   v1.2.3-alpha.1"
            echo "   v1.2.3-beta.1"
            echo "   v1.2.3-rc.1"
            echo "   v1.2.3-dev.1"
            echo "   v1.2.3-post.1"
            exit 1
          fi

          echo "✅ Tag is valid"
      
      # 🧠 Extract version parts
      - name: 🧠 Extract version parts
        id: version
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/}

          # Normalize tag by removing optional "v" prefix
          # (e.g., "v1.2.3" → "1.2.3") for PEP 440 compliance
          VERSION=${RAW_TAG#v}

          echo "🔍 Raw tag: $RAW_TAG"
          echo "🔍 Version: $VERSION"

          # Split base + suffix
          BASE_VERSION=$(echo "$VERSION" | cut -d'-' -f1)
          SUFFIX=$(echo "$VERSION" | cut -s -d'-' -f2)

          # Extract MAJOR.MINOR.PATCH
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          # -------------------------------------------------
          # Detect release type (SemVer / PEP440 compatible)
          # -------------------------------------------------
          TYPE="stable"
          if [[ "$SUFFIX" == alpha* ]]; then
            TYPE="alpha"
          elif [[ "$SUFFIX" == beta* ]]; then
            TYPE="beta"
          elif [[ "$SUFFIX" == rc* ]]; then
            TYPE="rc"
          elif [[ "$SUFFIX" == dev* ]]; then
            TYPE="dev"
          elif [[ "$SUFFIX" == post* ]]; then
            TYPE="post"
          fi

          # Export outputs
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "base=$BASE_VERSION" >> $GITHUB_OUTPUT

          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT

          echo "✅ Extracted:"
          echo "  - MAJOR=$MAJOR"
          echo "  - MINOR=$MINOR"
          echo "  - PATCH=$PATCH"
          echo "  - TYPE=$TYPE"
      
      # 🔤 Normalize image name (GHCR requires lowercase)
      - name: 🔤 Normalize image name
        id: vars
        run: |
          echo "image_name=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 🔐 Login to the Container registry (GHCR)
      - name: 🔐 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # 🧠 Enable multi-architecture builds
      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🏷 Generate Docker tags dynamically
      - name: 🏷 Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}
          tags: |
            # Full version (v1.2.3)
            # type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.tag }}

            # Minor (v1.2)
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}

            # Major (v1)
            type=raw,value=${{ steps.version.outputs.major }}

            # Latest (only for default branch)
            # type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.version.outputs.type == 'stable' }}

      # 🐳 Build and push image
      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
